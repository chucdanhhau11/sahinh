<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaHinh-B2</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="topbar"><a class="brand" href="/MS/MSA0_0100">SaHinh-B2</a><nav id="main-nav" style="display:flex;gap:14px;flex-wrap:wrap;"><a href="/MS/MSA0_0100">Dashboard</a><a href="/SH/SHA0_0100">Cấu hình bài</a><a href="/SH/SHA0_0200">Cấu hình lỗi</a><a href="/SH/SHA0_0300">Preset</a><a href="/SH/SHA0_0400">Luồng 1</a><a href="/SH/SHA0_0500">Luồng 2</a><a href="/SH/SHA0_0600">Luồng 3</a><a href="/SH/SHA0_0700">Kết quả</a></nav><span class="spacer"></span><span id="current-user"></span><button onclick="logout()" style="padding:6px 12px;">Đăng xuất</button></div>
<div class="container">

<h1>Người dùng &amp; quyền</h1>
<div class="card"><h2>Danh sách user (chỉ Superadmin)</h2><div id="users">Đang tải...</div></div>
<div class="card"><h2>Tạo user mới (chỉ Superadmin)</h2>
<label>Tên đăng nhập</label><input id="u-name">
<label>Họ tên</label><input id="u-full">
<label>Vai trò</label><select id="u-role"><option>TEACHER</option><option>STUDENT</option><option>SUPERADMIN</option></select>
<label>Mật khẩu</label><input id="u-pass" type="password">
<div style="height:12px"></div><button onclick="createUser()">Tạo user</button></div>
<script>
async function loadUsers() {
  const r = await api('/api/MS/A0/MSA0_0200/users');
  document.getElementById('users').innerHTML = r.code !== 200 ? r.message
    : '<table><tr><th>ID</th><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th></tr>'
    + r.data.map(function (u) { return '<tr><td>' + u.ID + '</td><td>' + u.USERNAME + '</td><td>' + (u.FULL_NAME || '') + '</td><td>' + u.ROLE_CODE + '</td></tr>'; }).join('') + '</table>';
}
async function createUser() {
  const r = await api('/api/MS/A0/MSA0_0200/users', { method: 'POST', body: JSON.stringify({
    username: document.getElementById('u-name').value, fullName: document.getElementById('u-full').value,
    role: document.getElementById('u-role').value, password: document.getElementById('u-pass').value }) });
  toast(r.message); if (r.code === 200) loadUsers();
}
loadUsers();
</script>

</div>
<script src="/js/app.js"></script>

</body>
</html>
