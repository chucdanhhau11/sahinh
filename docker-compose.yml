services:
  mysql:
    image: mysql:8.0
    container_name: sahinh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: sahinh_b2
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    container_name: sahinh-app
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: sahinh_b2
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
